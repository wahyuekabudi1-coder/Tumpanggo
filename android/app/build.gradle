plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Apply Google Services plugin when real google-services.json is placed in android/app/.
// Release APK builds strictly require google-services.json so production APKs never ship without FCM.
def googleServicesFile = file("google-services.json")
if (googleServicesFile.exists()) {
    apply plugin: 'com.google.gms.google-services'
} else {
    def isReleaseBuild = gradle.startParameter.taskNames.any { taskName ->
        taskName.toLowerCase().contains("release")
    }
    if (isReleaseBuild) {
        throw new GradleException(
            "KONFIGURASI WAJIB BELUM LENGKAP: File 'android/app/google-services.json' tidak ditemukan. " +
            "Unduh google-services.json asli dari Firebase Console (Project: tumpanggo-70479, Android package: com.tumpanggo.merchant) " +
            "dan letakkan di android/app/google-services.json sebelum membangun APK Release."
        )
    } else {
        logger.warn(
            "[TumpangGo FCM] Peringatan: 'android/app/google-services.json' belum ditemukan. " +
            "Unduh dari Firebase Console (package: com.tumpanggo.merchant) agar FCM aktif pada perangkat."
        )
    }
}

android {
    namespace 'com.tumpanggo.merchant'
    compileSdk 34

    defaultConfig {
        // Unified package name across debug & release so google-services.json (com.tumpanggo.merchant)
        // works identically in both debug testing and production APK builds.
        applicationId "com.tumpanggo.merchant"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Firebase Cloud Messaging BOM & Native Messaging SDK
    implementation platform('com.google.firebase:firebase-bom:32.8.0')
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-analytics-ktx'

    // Coroutines & HTTP client for background token registration and outbox sync
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
